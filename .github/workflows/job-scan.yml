name: Scan for new PM jobs

on:
  schedule:
    # Scan every 6 hours. New roles are queued, not sent; only urgent items
    # (govt deadlines within 3 days, reposted roles) go out immediately.
    - cron: '0 */6 * * *'
    # 02:30 UTC = 8:00 AM IST: scan, then send the morning digest.
    - cron: '30 2 * * *'
  workflow_dispatch: # run manually from the Actions tab
    inputs:
      send_digest:
        description: 'Also send the digest now (instead of waiting for 8 AM IST)'
        type: boolean
        default: false

# Two runs never overlap (the 00:00 and 02:30 UTC runs are close), so they
# can't race each other committing the scanner's state files.
concurrency:
  group: job-scan
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the scanner's state files back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run job scan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SEND_DIGEST: ${{ (github.event.schedule == '30 2 * * *' || inputs.send_digest) && '1' || '0' }}
        run: node agent/scan-jobs.mjs

      - name: Commit updated scanner state (seen jobs, govt openings, hiring signals)
        run: |
          git config user.name "pm-job-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agent/seen-jobs.json agent/govt-openings.json agent/ats-history.json agent/signals.json agent/digest-queue.json agent/company-roles.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          # The queue and reminder state must land, or a digest/reminder could be
          # re-sent: if main moved during the run, rebase onto it and retry.
          for i in 1 2 3; do git push && break; git pull --rebase origin main; done
